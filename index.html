<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>执业兽医资格考试学习系统</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16211c;
      --muted: #60706a;
      --line: #dbe5df;
      --paper: #fbfdfb;
      --soft: #eef5f1;
      --green: #1f7a4d;
      --green-dark: #155b39;
      --blue: #2667a6;
      --amber: #a86615;
      --red: #b23535;
      --white: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(251, 253, 251, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .sub {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      min-height: 42px;
    }

    .tab.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--white);
      font-weight: 700;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 16px 92px;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      align-items: start;
    }

    aside, .panel, .card, .question {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 8px;
    }

    aside {
      position: sticky;
      top: 112px;
      padding: 12px;
    }

    .subject-list {
      display: grid;
      gap: 8px;
    }

    .subject {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 8px;
      padding: 11px;
      text-align: left;
      cursor: pointer;
    }

    .subject.active {
      border-color: var(--green);
      background: #e4f3ea;
    }

    .subject b {
      display: block;
      font-size: 14px;
    }

    .subject span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.45;
    }

    .panel {
      padding: 16px;
      min-height: 560px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .hint {
      color: var(--muted);
      margin: 5px 0 0;
      line-height: 1.55;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      min-height: 40px;
    }

    .btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: var(--white);
      font-weight: 700;
    }

    .btn.warn {
      border-color: #f1d49c;
      background: #fff7e8;
      color: var(--amber);
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 14px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .progress-line {
      height: 8px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-line i {
      display: block;
      height: 100%;
      width: var(--p);
      background: var(--green);
    }

    .check-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .check-row:first-child { border-top: 0; }
    .check-row input { width: 18px; height: 18px; margin-top: 2px; }
    .check-row small, .meta { color: var(--muted); line-height: 1.45; }

    .memory-points {
      margin: 8px 0 0;
      padding-left: 18px;
      color: #2b4539;
      line-height: 1.55;
      font-size: 13px;
    }

    .memory-points li {
      margin: 4px 0;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      background: var(--soft);
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.hot { background: #ffeceb; color: var(--red); }
    .badge.good { background: #e4f3ea; color: var(--green-dark); }

    .question {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .stem {
      font-weight: 700;
      line-height: 1.55;
    }

    .option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      background: var(--white);
    }

    .option.selected { border-color: var(--blue); background: #edf6ff; }
    .option.correct { border-color: var(--green); background: #eaf7ef; }
    .option.wrong { border-color: var(--red); background: #fff0f0; }

    .answer-box {
      border-left: 4px solid var(--green);
      background: #f4faf6;
      padding: 11px;
      border-radius: 6px;
      color: #244237;
      line-height: 1.6;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 16px;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .sheet button {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
    }

    .sheet button.done { background: #e4f3ea; border-color: var(--green); }
    .sheet button.current { outline: 2px solid var(--blue); }

    .score {
      font-size: 34px;
      font-weight: 900;
      color: var(--green);
      line-height: 1.1;
    }

    .score-note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .score-note span {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .result-panel {
      display: grid;
      place-items: center;
      gap: 14px;
      min-height: 360px;
      text-align: center;
    }

    .result-panel .score {
      font-size: 56px;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      padding: 12px 16px;
      text-align: center;
      font-size: 12px;
      background: var(--white);
    }

    @media (max-width: 860px) {
      .brand-row, .section-head { display: grid; }
      .stats, .actions { justify-content: flex-start; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout, .exam-grid, .grid.two { grid-template-columns: 1fr; }
      aside { position: static; }
      .subject-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { padding-bottom: 42px; }

      body.exam-mode header .sub,
      body.exam-mode header .stats,
      body.exam-mode aside,
      body.exam-mode footer,
      body.exam-mode .sheet-card {
        display: none;
      }

      body.exam-mode .topbar {
        padding: 8px 10px;
        gap: 6px;
      }

      body.exam-mode .mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        font-size: 14px;
      }

      body.exam-mode h1 {
        font-size: 15px;
      }

      body.exam-mode nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }

      body.exam-mode .tab {
        min-height: 32px;
        padding: 6px 2px;
        font-size: 12px;
        border-radius: 6px;
      }

      body.exam-mode main {
        padding: 6px 8px 10px;
      }

      body.exam-mode .panel {
        min-height: auto;
        border: 0;
        padding: 0;
        background: transparent;
      }

      body.exam-mode .section-head {
        gap: 6px;
        margin-bottom: 6px;
      }

      body.exam-mode .section-head h2 {
        font-size: 16px;
      }

      body.exam-mode .section-head .hint {
        display: none;
      }

      body.exam-mode .actions {
        gap: 6px;
      }

      body.exam-mode .btn {
        min-height: 32px;
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 6px;
      }

      body.exam-mode .exam-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      body.exam-mode .exam-grid > .grid {
        order: -1;
        gap: 6px;
      }

      body.exam-mode .progress-card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        padding: 7px 9px;
      }

      body.exam-mode .progress-card h3,
      body.exam-mode .progress-card .hint {
        display: none;
      }

      body.exam-mode .progress-card .score {
        font-size: 20px;
      }

      body.exam-mode .score-note {
        margin: 0;
        gap: 5px;
      }

      body.exam-mode .score-note span {
        padding: 5px;
        font-size: 11px;
      }

      body.exam-mode .question {
        padding: 10px;
        gap: 8px;
      }

      body.exam-mode .meta {
        font-size: 11px;
      }

      body.exam-mode .stem {
        font-size: 15px;
        line-height: 1.38;
      }

      body.exam-mode .question .grid {
        gap: 7px;
      }

      body.exam-mode .option {
        padding: 8px;
        gap: 7px;
        font-size: 14px;
        line-height: 1.35;
        border-radius: 6px;
      }

      body.exam-mode .answer-box {
        padding: 8px;
        font-size: 13px;
        line-height: 1.38;
      }

      body.exam-mode .result-panel {
        min-height: calc(100vh - 150px);
        gap: 10px;
        padding: 14px;
      }

      body.exam-mode .result-panel .score {
        font-size: 46px;
      }

      body:not(.exam-mode) nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="topbar">
        <div class="brand-row">
          <div class="brand">
            <div class="mark">兽</div>
            <div>
              <h1>执业兽医资格考试学习系统</h1>
              <p class="sub">基础、预防、临床、综合应用四科贯通：清单学习、专题练习、错题复现、真题模拟</p>
            </div>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <nav id="tabs"></nav>
      </div>
    </header>
    <main>
      <div class="layout">
        <aside>
          <div class="subject-list" id="subjects"></div>
        </aside>
        <section class="panel" id="view"></section>
      </div>
    </main>
    <footer>题库内容为可替换练习数据；正式备考请替换为本人合法取得的官方真题与授权解析。</footer>
  </div>

  <script>
    const subjects = [
      {
        name: "基础科目",
        desc: "法规、解剖、生理、病理、药理",
        topics: [
          ["执业兽医法律责任", "能区分执业、用药、处方、诊疗记录中的常见合规风险。"],
          ["动物解剖与组织胚胎", "掌握消化、呼吸、泌尿、生殖、神经系统核心结构。"],
          ["动物生理与生化", "理解体温、循环、呼吸、消化、内分泌调节机制。"],
          ["动物病理学", "识别炎症、坏死、变性、肿瘤、休克等基础病理过程。"],
          ["兽医药理学", "熟悉抗菌药、抗寄生虫药、麻醉镇痛药的作用与禁忌。"]
        ]
      },
      {
        name: "预防科目",
        desc: "微生物、免疫、传染病、寄生虫、公共卫生",
        topics: [
          ["兽医微生物与免疫", "掌握病原分类、免疫应答、疫苗免疫与实验诊断。"],
          ["动物传染病学", "熟悉高发传染病的病原、流行病学、诊断和防控。"],
          ["兽医寄生虫学", "掌握常见寄生虫生活史、诊断、治疗和预防。"],
          ["兽医公共卫生", "覆盖人畜共患病、检疫、屠宰卫生和无害化处理。"],
          ["重大动物疫病防控", "能判断报告、隔离、扑杀、消毒、免疫等处置顺序。"]
        ]
      },
      {
        name: "临床科目",
        desc: "诊断、内科、外科、产科、中兽医",
        topics: [
          ["兽医临床诊断", "掌握问诊、视诊、触诊、叩诊、听诊及实验室检查逻辑。"],
          ["兽医内科学", "能处理消化、呼吸、循环、泌尿、营养代谢类病例。"],
          ["兽医外科与手术", "掌握无菌、麻醉、止血、缝合、创伤和常见手术原则。"],
          ["兽医产科学", "识别难产、产后疾病、繁殖障碍和新生动物问题。"],
          ["中兽医学", "理解辨证、方药、针灸与常见证型处理。"]
        ]
      },
      {
        name: "综合应用科目",
        desc: "猪、禽、牛羊、犬猫病例综合判断",
        topics: [
          ["猪病综合诊疗", "围绕腹泻、呼吸、繁殖、免疫失败等病例做鉴别诊断。"],
          ["禽病综合诊疗", "训练鸡鸭鹅高发病的剖检、流行特点和防控方案。"],
          ["牛羊病综合诊疗", "掌握反刍动物代谢病、传染病、寄生虫病和产科问题。"],
          ["犬猫病综合诊疗", "处理呕吐腹泻、皮肤病、泌尿、生殖、传染病病例。"],
          ["病例处置流程", "从主诉到检查、诊断、治疗、预后、复盘形成闭环。"]
        ]
      }
    ];

    const questions = [
      {
        subject: "基础科目", topic: "执业兽医法律责任",
        stem: "执业兽医出具诊疗记录时，最应保证的是哪一项？",
        options: ["记录完整、真实、可追溯", "只记录收费项目", "只写药品商品名", "由畜主自行补写"],
        answer: 0,
        explain: "诊疗记录是执业行为和医疗质量的重要凭证，应真实、完整、规范并可追溯。"
      },
      {
        subject: "基础科目", topic: "动物解剖与组织胚胎",
        stem: "反刍动物瘤胃的主要功能是？",
        options: ["分泌胆汁", "微生物发酵和粗纤维消化", "产生红细胞", "完成尿液浓缩"],
        answer: 1,
        explain: "瘤胃内微生物参与纤维素发酵，产生挥发性脂肪酸，是反刍动物能量利用的核心。"
      },
      {
        subject: "基础科目", topic: "动物生理与生化",
        stem: "动物体温调节中，位于中枢调控关键位置的是？",
        options: ["下丘脑", "脾脏", "胰腺", "肾小球"],
        answer: 0,
        explain: "下丘脑是体温调节中枢，整合外周和中枢温度信息并调节产热、散热。"
      },
      {
        subject: "基础科目", topic: "动物病理学",
        stem: "急性炎症局部典型表现通常包括？",
        options: ["红、肿、热、痛和功能障碍", "永久无痛性萎缩", "只出现色素沉着", "仅有组织钙化"],
        answer: 0,
        explain: "急性炎症因血管扩张、渗出和炎性介质作用，常出现红肿热痛及功能障碍。"
      },
      {
        subject: "基础科目", topic: "兽医药理学",
        stem: "治疗细菌感染时，联合用药最需要首先考虑的是哪一项？",
        options: ["药物颜色是否一致", "抗菌谱、作用机制和不良反应是否互补", "是否都能加入饮水", "包装规格是否相同"],
        answer: 1,
        explain: "联合用药应围绕病原、药代动力学、作用机制和毒副作用判断，避免拮抗和重复毒性。"
      },
      {
        subject: "预防科目", topic: "兽医微生物与免疫",
        stem: "疫苗免疫后产生保护效果，主要依赖机体形成哪类能力？",
        options: ["免疫记忆和特异性应答", "立即消除所有病原", "永久停止代谢", "改变动物品种"],
        answer: 0,
        explain: "疫苗通过模拟抗原刺激形成特异性免疫和免疫记忆，降低感染或发病风险。"
      },
      {
        subject: "预防科目", topic: "动物传染病学",
        stem: "群体性发病调查中，最能帮助判断传染病传播特点的是？",
        options: ["发病时间、空间分布和接触史", "饲养员年龄", "圈舍门牌号", "治疗账单编号"],
        answer: 0,
        explain: "流行病学三间分布和接触史是判断传染源、传播途径、易感群体的关键线索。"
      },
      {
        subject: "预防科目", topic: "兽医寄生虫学",
        stem: "控制寄生虫病复发时，除了治疗患病动物，还应重点关注什么？",
        options: ["环境和中间宿主管理", "更换项圈颜色", "减少病例记录", "停止饮水"],
        answer: 0,
        explain: "许多寄生虫有复杂生活史，环境、媒介和中间宿主控制是减少再感染的关键。"
      },
      {
        subject: "预防科目", topic: "兽医公共卫生",
        stem: "发现疑似狂犬病动物时，最恰当的处置思路是？",
        options: ["自行观察数日后再报告", "立即隔离并按规定报告和处置", "先使用普通抗菌药治疗", "直接进入市场销售"],
        answer: 1,

        "急诊先处理 ABC：气道、呼吸、循环；休克、严重脱水、尿闭、难产优先级高。",
        "诊断不要跳步：不能只凭单一症状下结论，要用关键证据排除相似病。",
        "治疗方案要写清病因治疗、对症治疗、支持疗法、护理、隔离和复查。",
        "考试作答要结构化：先判断是什么，再说明为什么，最后写怎么处理和怎么预防复发。"
      ]
    };

    const tabs = [
      ["plan", "今日计划"],
      ["checklist", "知识点清单"],
      ["practice", "专题练习"],
      ["wrongbook", "错题复现"],
      ["exam", "真题模拟"]
    ];

    const storeKey = "vetExamPagesState.v8";
    let state = JSON.parse(localStorage.getItem(storeKey) || "{}");
    state.tab ||= "plan";
    state.subject ||= subjects[0].name;
    state.checked ||= {};
    state.answers ||= {};
    state.wrong ||= {};
    state.daily ||= {};
    state.flow ||= { active: false, subjectIndex: 0, stepIndex: 0, completed: false };
    state.exam ||= { subject: null, index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
    let reviewTimer = null;

    const planStart = "2026-08-13";
    const defaultExamDate = "2027-07-11";
    const reviewOffsets = [1, 3, 7, 15, 30];
    const flowSteps = [
      { id: "checklist", tab: "checklist", label: "知识清单" },
      { id: "practice", tab: "practice", label: "专题练习" },
      { id: "wrong", tab: "wrongbook", label: "错题复现" },
      { id: "mock", tab: "exam", label: "小模拟考" }
    ];

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function dateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function daysBetween(start, end) {
      return Math.floor((parseDate(end) - parseDate(start)) / 86400000);
    }

    function allTopics() {
      return subjects.flatMap(subject => subject.topics.map(topic => ({
        subject: subject.name,
        title: topic[0],
        desc: topic[1]
      })));
    }

    function topicForDay(dayIndex, multiplier = 1) {
      const topics = allTopics();
      return topics[Math.abs(Math.floor(dayIndex * multiplier)) % topics.length];
    }

    function topicForSubject(subjectName, seed = 0) {
      const topics = allTopics().filter(topic => topic.subject === subjectName);
      return topics[Math.abs(seed) % Math.max(1, topics.length)] || topicForDay(seed);
    }

    function phaseForDay(dayIndex) {
      if (dayIndex < 120) return { name: "第一轮", label: "建立知识框架", dailyNew: 1, mock: "周末做 20 题小模拟" };
      if (dayIndex < 220) return { name: "第二轮", label: "专题强化与错题回炉", dailyNew: 0, mock: "每周 1 套真题模拟" };
      if (dayIndex < 300) return { name: "第三轮", label: "全科综合冲刺", dailyNew: 0, mock: "每 2-3 天 1 套真题模拟" };
      return { name: "考前冲刺", label: "整卷速度与高频错题", dailyNew: 0, mock: "每天真题模拟或错题整卷复盘" };
    }

    function todaysPlan() {
      const today = dateKey();
      const dayIndex = Math.max(0, daysBetween(planStart, today));
      const totalDays = Math.max(1, daysBetween(planStart, defaultExamDate));
      const phase = phaseForDay(dayIndex);
      const diagnosis = performanceDiagnosis();
      const adaptiveSubject = phase.name === "第一轮" ? null : diagnosis.weakest.subject;
      const mainTopic = adaptiveSubject ? topicForSubject(adaptiveSubject, dayIndex) : topicForDay(dayIndex);
      const secondTopic = adaptiveSubject ? topicForSubject(adaptiveSubject, dayIndex + 2) : topicForDay(dayIndex + 5, 1);
      const reviews = reviewOffsets.map(offset => {
        const sourceDay = dayIndex - offset;
        if (sourceDay < 0) return null;
        return { offset, ...topicForDay(sourceDay) };
      }).filter(Boolean);
      const weekday = new Date().getDay();
      const mockToday = phase.name === "第一轮" ? (weekday === 0 || weekday === 6) : phase.name === "第二轮" ? weekday === 0 : dayIndex % 3 === 0;
      return { today, dayIndex, totalDays, phase, mainTopic, secondTopic, reviews, mockToday, diagnosis };
    }

    function dailyDone(id) {
      const key = todaysPlan().today;
      return Boolean(state.daily[key]?.[id]);
    }

    function dailyStepId(subjectName, stepId) {
      return `${subjectName}-${stepId}`;
    }

    function toggleDaily(id) {
      const key = todaysPlan().today;
      state.daily[key] ||= {};
      state.daily[key][id] = !state.daily[key][id];
      save();
    }

    function markDaily(id) {
      const key = todaysPlan().today;
      state.daily[key] ||= {};
      state.daily[key][id] = true;
    }

    function currentFlowStep() {
      return flowSteps[state.flow.stepIndex] || flowSteps[0];
    }

    function currentFlowSubject() {
      return subjects[state.flow.subjectIndex] || subjects[0];
    }

    function isCurrentFlow(tabOrStep) {
      return state.flow.active && !state.flow.completed && state.subject === currentFlowSubject().name && (currentFlowStep().tab === tabOrStep || currentFlowStep().id === tabOrStep);
    }

    function startDailyFlow() {
      state.flow = { active: true, subjectIndex: 0, stepIndex: 0, completed: false };
      state.subject = subjects[0].name;
      state.tab = "checklist";
      save();
    }

    function goFlowPosition(subjectIndex, stepIndex) {
      if (subjectIndex >= subjects.length) {
        completeDailyFlow();
        return;
      }
      const subject = subjects[subjectIndex];
      const step = flowSteps[stepIndex];
      state.flow = { active: true, subjectIndex, stepIndex, completed: false };
      state.subject = subject.name;
      if (step.id === "mock") {
        state.tab = "exam";
        clearTimeout(reviewTimer);
        state.exam = { subject: subject.name, index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
      } else {
        state.tab = step.tab;
      }
      save();
    }

    function advanceFlow() {
      if (!state.flow.active || state.flow.completed) return;
      const subject = currentFlowSubject();
      const step = currentFlowStep();
      markDaily(dailyStepId(subject.name, step.id));
      if (state.flow.stepIndex < flowSteps.length - 1) {
        goFlowPosition(state.flow.subjectIndex, state.flow.stepIndex + 1);
      } else {
        goFlowPosition(state.flow.subjectIndex + 1, 0);
      }
    }

    function completeDailyFlow() {
      subjects.forEach(subject => flowSteps.forEach(step => markDaily(dailyStepId(subject.name, step.id))));
      markDaily("today-complete");
      state.flow = { active: false, subjectIndex: subjects.length - 1, stepIndex: flowSteps.length - 1, completed: true };
      state.tab = "plan";
      save();
    }

    function save() {
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
    }

    function currentSubject() {
      return subjects.find(s => s.name === state.subject) || subjects[0];
    }

    function subjectQuestions(name = state.subject) {
      return questions.filter(q => q.subject === name);
    }

    function examQuestionIndexes() {
      return questions
        .map((q, index) => ({ q, index }))
        .filter(item => !state.exam.subject || item.q.subject === state.exam.subject)
        .map(item => item.index);
    }

    function doneCount() {
      return Object.values(state.checked).filter(Boolean).length;
    }

    function totalTopics() {
      return subjects.reduce((sum, s) => sum + s.topics.length, 0);
    }

    function wrongList() {
      return Object.entries(state.wrong)
        .map(([id, item]) => ({ id: Number(id), ...item, q: questions[Number(id)] }))
        .filter(item => item.q)
        .sort((a, b) => b.count - a.count);
    }

    function clearSubjectWrong(subjectName) {
      Object.keys(state.wrong).forEach(id => {
        const q = questions[Number(id)];
        if (q?.subject === subjectName) delete state.wrong[id];
      });
      save();
    }

    function performanceDiagnosis() {
      const rows = subjects.map(subject => {
        const subjectQs = questions.filter(q => q.subject === subject.name);
        const answeredIndexes = subjectQs
          .map(q => questions.indexOf(q))
          .filter(index => state.answers[index] !== undefined || state.exam.answers[index] !== undefined);
        const correct = answeredIndexes.filter(index => {
          const picked = state.exam.answers[index] ?? state.answers[index];
          return picked === questions[index].answer;
        }).length;
        const wrongCount = subjectQs.reduce((sum, q) => {
          const index = questions.indexOf(q);
          return sum + (state.wrong[index]?.count || 0);
        }, 0);
        const topicTotal = subject.topics.length;
        const topicDone = subject.topics.filter(topic => state.checked[subject.name + ":" + topic[0]]).length;
        const answered = answeredIndexes.length;
        const accuracy = answered ? Math.round(correct / answered * 100) : 0;
        const checklist = Math.round(topicDone / topicTotal * 100);
        const readiness = Math.round(accuracy * 0.65 + checklist * 0.25 + Math.max(0, 100 - wrongCount * 8) * 0.1);
        return { subject: subject.name, answered, correct, wrongCount, accuracy, checklist, readiness };
      });
      const answeredTotal = rows.reduce((sum, row) => sum + row.answered, 0);
      const correctTotal = rows.reduce((sum, row) => sum + row.correct, 0);
      const checklistTotal = Math.round(doneCount() / totalTopics() * 100);
      const accuracyTotal = answeredTotal ? Math.round(correctTotal / answeredTotal * 100) : 0;
      const readiness = answeredTotal < 12
        ? Math.round(checklistTotal * 0.6 + accuracyTotal * 0.4)
        : Math.round(accuracyTotal * 0.7 + checklistTotal * 0.3);
      const sortedByNeed = [...rows].sort((a, b) => (a.readiness - b.readiness) || (b.wrongCount - a.wrongCount));
      const sortedByGood = [...rows].sort((a, b) => (b.readiness - a.readiness) || (b.answered - a.answered));
      const level = answeredTotal < 12
        ? "样本不足，先完成第一轮结业测评"
        : readiness >= 78
          ? "通过预判较稳"
          : readiness >= 65
            ? "有通过希望，但需要压薄弱科目"
            : "风险偏高，第二轮要重点补基础和错题";
      return {
        rows,
        answeredTotal,
        correctTotal,
        accuracyTotal,
        checklistTotal,
        readiness,
        level,
        weakest: sortedByNeed[0],
        strongest: sortedByGood[0]
      };
    }

    function setTab(tab) {
      state.tab = tab;
      save();
    }

    function setSubject(name) {
      state.subject = name;
      save();
    }

    function answerQuestion(index, choice) {
      state.answers[index] = choice;
      if (choice !== questions[index].answer) {
        const old = state.wrong[index] || { count: 0, last: 0 };
        state.wrong[index] = { count: old.count + 1, last: Date.now() };
      }
      const allSubjectAnswered = subjectQuestions(state.subject).every(q => state.answers[questions.indexOf(q)] !== undefined);
      if (isCurrentFlow("practice") && allSubjectAnswered) {
        advanceFlow();
        return;
      }
      save();
    }

    function answerExam(index, choice) {
      if (state.exam.submitted) return;
      const examIndexes = examQuestionIndexes();
      const position = Math.max(0, examIndexes.indexOf(index));
      state.exam.answers[index] = choice;
      if (position < examIndexes.length - 1) {
        state.exam.index = position + 1;
      } else {
        gradeExam();
      }
      save();
    }

    function gradeExam() {
      const examIndexes = examQuestionIndexes();
      state.exam.submitted = true;
      state.exam.reviewing = false;
      state.exam.autoReview = true;
      examIndexes.forEach(index => {
        const q = questions[index];
        if (state.exam.answers[index] !== q.answer) {
          const old = state.wrong[index] || { count: 0, last: 0 };
          state.wrong[index] = { count: old.count + 1, last: Date.now() };
        }
      });
    }

    function submitExam() {
      gradeExam();
      save();
    }

    function resetExam(subject = null) {
      clearTimeout(reviewTimer);
      state.exam = { subject, index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
      save();
    }

    function startSubjectExam(subject) {
      state.subject = subject;
      state.tab = "exam";
      clearTimeout(reviewTimer);
      state.exam = { subject, index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
      save();
    }

    function startReview() {
      state.exam.reviewing = true;
      state.exam.reviewIndex = 0;
      state.exam.autoReview = true;
      save();
    }

    function skipReview() {
      if (isCurrentFlow("mock")) {
        advanceFlow();
      } else {
        state.exam.reviewing = false;
        state.exam.autoReview = false;
        save();
      }
    }

    function moveReview(step) {
      const examIndexes = examQuestionIndexes();
      const next = Math.max(0, Math.min(examIndexes.length - 1, state.exam.reviewIndex + step));
      state.exam.reviewIndex = next;
      if (next >= examIndexes.length - 1) state.exam.autoReview = false;
      save();
    }

    function renderChrome() {
      document.getElementById("stats").innerHTML = `
        <span class="pill">清单 ${doneCount()}/${totalTopics()}</span>
        <span class="pill">错题 ${wrongList().length} 题</span>
        <span class="pill">手机可用</span>
      `;

      document.getElementById("tabs").innerHTML = tabs.map(([id, label]) => `
        <button class="tab ${state.tab === id ? "active" : ""}" onclick="setTab('${id}')">${label}</button>
      `).join("");

      document.getElementById("subjects").innerHTML = subjects.map(subject => {
        const total = subject.topics.length;
        const checked = subject.topics.filter(t => state.checked[subject.name + ":" + t[0]]).length;
        return `
          <button class="subject ${state.subject === subject.name ? "active" : ""}" onclick="setSubject('${subject.name}')">
            <b>${subject.name}</b>
            <span>${subject.desc}</span>
            <div class="progress-line" style="--p:${Math.round(checked / total * 100)}%"><i></i></div>
            <span>${checked}/${total} 已掌握</span>
          </button>
        `;
      }).join("");
    }

    function renderChecklist() {
      const subject = currentSubject();
      return `
        <div class="section-head">
          <div>
            <h2>${subject.name}知识点清单</h2>
            <p class="hint">先把每个知识点按“能讲出来、能做题、能举例”三步过一遍，再进入专题练习。</p>
          </div>
          <div class="actions">
            <button class="btn primary" onclick="${isCurrentFlow("checklist") ? "advanceFlow()" : "setTab('practice')"}">${isCurrentFlow("checklist") ? "完成清单，进入专题练习" : "开始专题练习"}</button>
          </div>
        </div>
        <div class="card">
          ${subject.topics.map(([title, desc]) => {
            const key = subject.name + ":" + title;
            const points = highYieldPoints[key] || [];
            return `
              <label class="check-row">
                <input type="checkbox" ${state.checked[key] ? "checked" : ""} onchange="state.checked['${key}']=this.checked;save()">
                <span>
                  <b>${title}</b><br>
                  <small>${desc}</small>
                  ${points.length ? `<ul class="memory-points">${points.map(point => `<li>${point}</li>`).join("")}</ul>` : ""}
                </span>
                <span class="badge ${state.checked[key] ? "good" : ""}">${state.checked[key] ? "已掌握" : "待学习"}</span>
              </label>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderPlan() {
      const plan = todaysPlan();
      const diagnosis = plan.diagnosis;
      const percent = Math.min(100, Math.round(plan.dayIndex / plan.totalDays * 100));
      const todayComplete = dailyDone("today-complete");
      const subjectSteps = subjects.flatMap((subject, subjectIndex) => [
        {
          id: `${subject.name}-checklist`,
          subject: subject.name,
          order: subjectIndex + 1,
          title: "知识清单",
          minutes: 2,
          desc: `快速过 ${topicForSubject(subject.name, plan.dayIndex + subjectIndex).title}，先确认今天要掌握的点。`,
          action: "去清单",
          click: `goFlowPosition(${subjectIndex},0)`
        },
        {
          id: `${subject.name}-practice`,
          subject: subject.name,
          order: subjectIndex + 1,
          title: "专题练习",
          minutes: 3,
          desc: plan.phase.name === "第一轮" ? "做本学科示例题，错题自动进错题本。" : "按能力画像优先补薄弱知识点。",
          action: "去练习",
          click: `goFlowPosition(${subjectIndex},1)`
        },
        {
          id: `${subject.name}-wrong`,
          subject: subject.name,
          order: subjectIndex + 1,
          title: "错题复现",
          minutes: 2,
          desc: wrongList().filter(item => item.q.subject === subject.name).length ? "只复现本科目错题，优先看高频错题。" : "本科目暂无错题，今天做错后会自动沉淀。",
          action: "去错题",
          click: `goFlowPosition(${subjectIndex},2)`
        },
        {
          id: `${subject.name}-mock`,
          subject: subject.name,
          order: subjectIndex + 1,
          title: "科目小模拟",
          minutes: 3,
          desc: "做本科目小模拟，答完自动计分并可顺序看解析。",
          action: "开始模拟",
          click: `goFlowPosition(${subjectIndex},3)`
        }
      ]);

      const reviewTasks = plan.reviews.map(item => `
        <label class="check-row">
          <input type="checkbox" ${dailyDone(`review-${item.offset}-${item.title}`) ? "checked" : ""} onchange="toggleDaily('review-${item.offset}-${item.title}')">
          <span><b>${item.offset} 天前内容复习：${item.subject} · ${item.title}</b><br><small>${item.desc}</small></span>
          <span class="badge">记忆曲线</span>
        </label>
      `).join("");

      const doneCountToday = subjectSteps.filter(task => dailyDone(task.id)).length;
      const totalToday = subjectSteps.length;

      return `
        <div class="section-head">
          <div>
            <h2>今日学习计划</h2>
            <p class="hint">从 ${planStart} 开始，到 ${defaultExamDate} 前完成三轮学习与考前冲刺。2027 年官方考试日期公布后，可再调整终点。</p>
          </div>
          <div class="actions">
            <button class="btn primary" onclick="startDailyFlow()">${todayComplete ? "重新开始今日流程" : "开始今日40分钟学习"}</button>
            <button class="btn" onclick="setTab('exam')">真题模拟</button>
          </div>
        </div>
        ${todayComplete ? `
          <div class="result-panel card">
            <div>
              <div class="score">已打卡</div>
              <p class="hint">今天四个科目的知识清单、专题练习、错题复现和小模拟都完成了。稳稳往前走，明天继续加油。</p>
            </div>
          </div>
        ` : ""}
        <div class="grid two">
          <div class="card">
            <h3>${plan.phase.name} · ${plan.phase.label}</h3>
            <p class="hint">第 ${plan.dayIndex + 1} 天 / 约 ${plan.totalDays} 天，进度 ${percent}%</p>
            <div class="progress-line" style="--p:${percent}%"><i></i></div>
            <p class="hint">今日完成 ${doneCountToday}/${totalToday} 项。每天约 40 分钟：四个科目依次走完清单、专题、错题、小模拟。</p>
          </div>
          <div class="card">
            <h3>三轮节奏</h3>
            <p class="hint">第一轮：搭框架，所有知识点过一遍。第二轮：按专题强化，错题回炉。第三轮：整卷训练，把速度、准确率和高频错题压实。最后 30 天只做模拟、错题和薄弱点。</p>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="section-head">
            <div>
              <h3>能力画像与通过预判</h3>
              <p class="hint">${diagnosis.level}。当前综合准备度 ${diagnosis.readiness}%，练习正确率 ${diagnosis.accuracyTotal}%，知识清单完成 ${diagnosis.checklistTotal}%。</p>
            </div>
            <span class="badge ${diagnosis.readiness >= 78 ? "good" : diagnosis.readiness < 60 ? "hot" : ""}">${diagnosis.answeredTotal < 12 ? "待测评" : "已诊断"}</span>
          </div>
          <div class="grid two">
            <div>
              <h3>薄弱点</h3>
              <p class="hint">${diagnosis.weakest.subject}：准备度 ${diagnosis.weakest.readiness}%；第二轮会优先推这个科目的专题和错题。</p>
            </div>
            <div>
              <h3>擅长点</h3>
              <p class="hint">${diagnosis.strongest.subject}：准备度 ${diagnosis.strongest.readiness}%；第三轮保持手感，避免优势科目掉分。</p>
            </div>
          </div>
          <div class="grid" style="margin-top:10px">
            ${diagnosis.rows.map(row => `
              <div>
                <div class="meta">${row.subject} · 正确率 ${row.accuracy}% · 知识清单 ${row.checklist}% · 错题 ${row.wrongCount} 次</div>
                <div class="progress-line" style="--p:${row.readiness}%"><i></i></div>
              </div>
            `).join("")}
          </div>
        </div>
        <div class="grid" style="margin-top:12px">
          ${subjects.map(subject => {
            const steps = subjectSteps.filter(step => step.subject === subject.name);
            const subjectDone = steps.filter(step => dailyDone(step.id)).length;
            return `
            <div class="card">
              <div class="section-head">
                <div>
                  <h3>${subject.name} · 第 ${subjects.indexOf(subject) + 1} 段 / 10 分钟</h3>
                  <p class="hint">先完成本科目四步，再进入下一个科目。完成 ${subjectDone}/4。</p>
                </div>
                <span class="badge ${subjectDone === 4 ? "good" : ""}">${subjectDone === 4 ? "已完成" : "进行中"}</span>
              </div>
              ${steps.map(step => `
                <label class="check-row">
                  <input type="checkbox" ${dailyDone(step.id) ? "checked" : ""} onchange="toggleDaily('${step.id}')">
                  <span><b>${step.title} · ${step.minutes} 分钟</b><br><small>${step.desc}</small></span>
                  <button class="btn" onclick="${step.click}">${step.action}</button>
                </label>
              `).join("")}
            </div>
          `}).join("")}
          <div class="card">
            <h3>记忆曲线复习提示</h3>
            <p class="hint">这些内容穿插在每个科目的“错题复现”2 分钟里，不额外增加今天 40 分钟总时长。</p>
            ${reviewTasks || `<p class="hint">今天是计划初期，还没有到 1/3/7/15/30 天复习节点。明天开始会自动出现回顾任务。</p>`}
          </div>
        </div>
      `;
    }

    function renderPractice() {
      const list = subjectQuestions();
      const answeredInSubject = list.filter(q => state.answers[questions.indexOf(q)] !== undefined).length;
      const allAnswered = list.length > 0 && answeredInSubject === list.length;
      return `
        <div class="section-head">
          <div>
            <h2>${state.subject}专题练习</h2>
            <p class="hint">每题作答后立即看解析，错题会自动进入错题本；本科目题目做完后会进入错题复现。</p>
          </div>
          <div class="actions"><button class="btn" onclick="${isCurrentFlow("practice") ? "advanceFlow()" : "setTab('wrongbook')"}">${isCurrentFlow("practice") ? "进入错题复现" : "查看错题"}</button></div>
        </div>
        <div class="grid">
          ${list.map(q => {
            const index = questions.indexOf(q);
            const picked = state.answers[index];
            return questionHtml(q, index, picked, picked !== undefined, "answerQuestion");
          }).join("") || `<div class="card">该科目暂未放入练习题，替换正式题库后会自动显示。</div>`}
          ${isCurrentFlow("practice") ? `<div class="card"><b>专题练习进度：${answeredInSubject}/${list.length}</b><p class="hint">${allAnswered ? "本科目专题练习已完成，系统会自动进入错题复现。" : "做完本科目全部题目后会自动跳转；也可以手动进入下一项。"}</p></div>` : ""}
        </div>
      `;
    }

    function questionHtml(q, index, picked, showAnswer, handler, displayNumber = index + 1) {
      return `
        <article class="question">
          <div class="meta">${q.subject} · ${q.topic}</div>
          <div class="stem">${displayNumber}. ${q.stem}</div>
          <div class="grid">
            ${q.options.map((op, i) => {
              const cls = picked === i ? "selected" : "";
              const reveal = showAnswer ? (i === q.answer ? " correct" : picked === i && picked !== q.answer ? " wrong" : "") : "";
              const click = showAnswer ? "" : `onclick="${handler}(${index},${i})"`;
              return `<button class="option ${cls}${reveal}" ${click}><b>${"ABCD"[i]}</b><span>${op}</span></button>`;
            }).join("")}
          </div>
          ${showAnswer ? `<div class="answer-box">参考答案：${"ABCD"[q.answer]}。${q.explain}</div>` : ""}
        </article>
      `;
    }

    function renderWrongBook() {
      const list = wrongList().filter(item => item.q.subject === state.subject);
      return `
        <div class="section-head">
          <div>
            <h2>${state.subject}错题复现</h2>
            <p class="hint">这里只看当前科目的错题，按出现次数排序，高频题优先复习；建议当天、3天、7天各复现一次。</p>
          </div>
          <div class="actions">
            <button class="btn primary" onclick="${isCurrentFlow("wrong") ? "advanceFlow()" : `startSubjectExam('${state.subject}')`}">${isCurrentFlow("wrong") ? "完成错题，进入小模拟" : "进入小模拟"}</button>
            <button class="btn warn" onclick="clearSubjectWrong('${state.subject}')">清空本科错题</button>
          </div>
        </div>
        <div class="grid">
          ${list.map(item => `
            <div class="card">
              <div class="section-head">
                <div>
                  <h3>${item.q.subject} · ${item.q.topic}</h3>
                  <p class="hint">${item.q.stem}</p>
                </div>
                <span class="badge ${item.count >= 2 ? "hot" : ""}">${item.count >= 2 ? "高频错题" : "错题"} ${item.count} 次</span>
              </div>
              <div class="answer-box">答案：${"ABCD"[item.q.answer]}。${item.q.explain}</div>
            </div>
          `).join("") || `<div class="card">${state.subject}目前还没有错题。先做专题练习或科目小模拟，错题会自动汇总到这里。</div>`}
        </div>
      `;
    }

    function renderExam() {
      const exam = state.exam;
      const examIndexes = examQuestionIndexes();
      const activePosition = Math.min(exam.reviewing ? exam.reviewIndex : exam.index, examIndexes.length - 1);
      const activeIndex = examIndexes[activePosition] ?? 0;
      const q = questions[activeIndex];
      const answered = examIndexes.filter(index => exam.answers[index] !== undefined).length;
      const score = examIndexes.filter(index => exam.answers[index] === questions[index].answer).length;
      const total = examIndexes.length;
      const percent = Math.round(score / total * 100);
      const unanswered = total - answered;
      const wrong = total - score - unanswered;
      const examTitle = exam.subject ? `${exam.subject}小模拟` : "真题模拟测试";

      clearTimeout(reviewTimer);
      if (exam.submitted && exam.reviewing && exam.autoReview) {
        reviewTimer = setTimeout(() => {
          if (state.exam.reviewIndex < total - 1) {
            state.exam.reviewIndex += 1;
            save();
          } else if (isCurrentFlow("mock")) {
            advanceFlow();
          } else {
            state.exam.autoReview = false;
            save();
          }
        }, 7000);
      }

      if (exam.submitted && !exam.reviewing) {
        return `
          <div class="section-head">
            <div>
              <h2>${examTitle}</h2>
              <p class="hint">本次模拟已自动交卷，下面是本次成绩。</p>
            </div>
            <div class="actions"><button class="btn" onclick="resetExam(${exam.subject ? `'${exam.subject}'` : ""})">重新开始</button></div>
          </div>
          <div class="result-panel card">
            <div>
              <div class="score">${percent}分</div>
              <p class="hint">总分 100 分，共 ${total} 题；答对 ${score} 题，错题 ${wrong} 题，未答 ${unanswered} 题。</p>
            </div>
            <h3>需要现在按顺序看解析吗？</h3>
            <div class="actions">
              <button class="btn primary" onclick="startReview()">需要，看解析</button>
              <button class="btn" onclick="skipReview()">${isCurrentFlow("mock") ? "不看解析，进入下一科" : "暂时不看"}</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="section-head">
          <div>
            <h2>${examTitle}</h2>
            <p class="hint">${exam.reviewing ? "解析会按题号自动往后播放，也可以手动上一题或下一题。" : "选完答案自动进入下一题；最后一题答完会自动交卷计分。"}</p>
          </div>
          <div class="actions">
            <button class="btn" onclick="resetExam(${exam.subject ? `'${exam.subject}'` : ""})">重新开始</button>
            ${exam.reviewing ? `
              <button class="btn" onclick="state.exam.autoReview=!state.exam.autoReview;save()">${exam.autoReview ? "暂停自动播放" : "继续自动播放"}</button>
            ` : `<button class="btn primary" onclick="submitExam()">提前交卷</button>`}
          </div>
        </div>
        <div class="exam-grid">
          <div>
            ${questionHtml(q, activeIndex, exam.answers[activeIndex], exam.submitted, "answerExam", activePosition + 1)}
            ${exam.reviewing ? `
              <div class="actions" style="margin-top:12px;justify-content:space-between">
                <button class="btn" onclick="moveReview(-1)" ${exam.reviewIndex === 0 ? "disabled" : ""}>上一题解析</button>
                <button class="btn primary" onclick="${exam.reviewIndex === total - 1 && isCurrentFlow("mock") ? "advanceFlow()" : "moveReview(1)"}" ${exam.reviewIndex === total - 1 && !isCurrentFlow("mock") ? "disabled" : ""}>${exam.reviewIndex === total - 1 && isCurrentFlow("mock") ? "完成解析，进入下一科" : "下一题解析"}</button>
              </div>
            ` : ""}
          </div>
          <div class="grid">
            <div class="card progress-card">
              <h3>${exam.reviewing ? "解析进度" : "答题进度"}</h3>
              <div class="score">${exam.reviewing ? (exam.reviewIndex + 1) + "/" + total : answered + "/" + total}</div>
              ${exam.submitted ? `
                <div class="score-note">
                  <span>答对 ${score}</span>
                  <span>错题 ${wrong}</span>
                  <span>未答 ${unanswered}</span>
                </div>
              ` : ""}
              <p class="hint">${exam.reviewing ? "当前解析会自动向后播放，最后一题会停住。" : "选完一题会自动跳到下一题。"}</p>
            </div>
            <div class="card sheet-card">
              <h3>答题卡</h3>
              <div class="sheet">
                ${examIndexes.map((index, position) => `<button class="${exam.answers[index] !== undefined ? "done" : ""} ${exam.index === position ? "current" : ""}" onclick="state.exam.index=${position};save()">${position + 1}</button>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      document.body.classList.toggle("exam-mode", state.tab === "exam");
      renderChrome();
      const view = document.getElementById("view");
      view.innerHTML = {
        plan: renderPlan,
        checklist: renderChecklist,
        practice: renderPractice,
        wrongbook: renderWrongBook,
        exam: renderExam
      }[state.tab]();
    }

    render();
  </script>
</body>
</html>
