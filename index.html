<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>执业兽医资格考试学习系统</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16211c;
      --muted: #60706a;
      --line: #dbe5df;
      --paper: #fbfdfb;
      --soft: #eef5f1;
      --green: #1f7a4d;
      --green-dark: #155b39;
      --blue: #2667a6;
      --amber: #a86615;
      --red: #b23535;
      --white: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(251, 253, 251, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .sub {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      min-height: 42px;
    }

    .tab.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--white);
      font-weight: 700;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 16px 92px;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      align-items: start;
    }

    aside, .panel, .card, .question {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 8px;
    }

    aside {
      position: sticky;
      top: 112px;
      padding: 12px;
    }

    .subject-list {
      display: grid;
      gap: 8px;
    }

    .subject {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 8px;
      padding: 11px;
      text-align: left;
      cursor: pointer;
    }

    .subject.active {
      border-color: var(--green);
      background: #e4f3ea;
    }

    .subject b {
      display: block;
      font-size: 14px;
    }

    .subject span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.45;
    }

    .panel {
      padding: 16px;
      min-height: 560px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .hint {
      color: var(--muted);
      margin: 5px 0 0;
      line-height: 1.55;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      min-height: 40px;
    }

    .btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: var(--white);
      font-weight: 700;
    }

    .btn.warn {
      border-color: #f1d49c;
      background: #fff7e8;
      color: var(--amber);
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 14px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .progress-line {
      height: 8px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-line i {
      display: block;
      height: 100%;
      width: var(--p);
      background: var(--green);
    }

    .check-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .check-row:first-child { border-top: 0; }
    .check-row input { width: 18px; height: 18px; margin-top: 2px; }
    .check-row small, .meta { color: var(--muted); line-height: 1.45; }

    .badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      background: var(--soft);
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.hot { background: #ffeceb; color: var(--red); }
    .badge.good { background: #e4f3ea; color: var(--green-dark); }

    .question {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .stem {
      font-weight: 700;
      line-height: 1.55;
    }

    .option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      background: var(--white);
    }

    .option.selected { border-color: var(--blue); background: #edf6ff; }
    .option.correct { border-color: var(--green); background: #eaf7ef; }
    .option.wrong { border-color: var(--red); background: #fff0f0; }

    .answer-box {
      border-left: 4px solid var(--green);
      background: #f4faf6;
      padding: 11px;
      border-radius: 6px;
      color: #244237;
      line-height: 1.6;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 16px;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .sheet button {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
    }

    .sheet button.done { background: #e4f3ea; border-color: var(--green); }
    .sheet button.current { outline: 2px solid var(--blue); }

    .score {
      font-size: 34px;
      font-weight: 900;
      color: var(--green);
      line-height: 1.1;
    }

    .score-note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .score-note span {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .result-panel {
      display: grid;
      place-items: center;
      gap: 14px;
      min-height: 360px;
      text-align: center;
    }

    .result-panel .score {
      font-size: 56px;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      padding: 12px 16px;
      text-align: center;
      font-size: 12px;
      background: var(--white);
    }

    @media (max-width: 860px) {
      .brand-row, .section-head { display: grid; }
      .stats, .actions { justify-content: flex-start; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout, .exam-grid, .grid.two { grid-template-columns: 1fr; }
      aside { position: static; }
      .subject-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { padding-bottom: 42px; }
    }
  </style>
</head>

        subject: "综合应用科目", topic: "猪病综合诊疗",
        stem: "猪群出现咳嗽、发热、采食下降时，综合题首先应分析？",
        options: ["日龄、免疫史、发病率和病死率", "耳标颜色", "饲养员姓名笔画", "栏舍编号是否好看"],
        answer: 0,
        explain: "猪群病例要先抓群体流行特征和免疫背景，再结合症状、剖检和实验室结果判断。"
      },
      {
        subject: "综合应用科目", topic: "禽病综合诊疗",
        stem: "鸡群呼吸道症状伴产蛋下降时，最需要结合判断的是？",
        options: ["免疫程序、剖检变化和病原检测", "蛋托颜色", "饲料袋字体", "鸡舍门朝向"],
        answer: 0,
        explain: "禽病综合诊断要结合群体症状、免疫程序、剖检和实验室检测，避免只凭单一表现下结论。"
      },
      {
        subject: "综合应用科目", topic: "牛羊病综合诊疗",
        stem: "奶牛产后食欲差、酮味明显、产奶下降时，应优先考虑哪类问题？",
        options: ["营养代谢病", "单纯外伤", "羽毛脱落", "听觉训练不足"],
        answer: 0,
        explain: "产后高产奶牛易发生能量负平衡，酮病等营养代谢病需重点鉴别。"
      },
      {
        subject: "综合应用科目", topic: "犬猫病综合诊疗",
        stem: "犬出现呕吐、腹泻、精神沉郁时，病例分析首先应补充哪类信息？",
        options: ["主人职业", "疫苗史、饮食史、体温和脱水情况", "犬舍颜色", "牵引绳品牌"],
        answer: 1,
        explain: "综合应用题重在病例信息整合，疫苗、饮食、体征和脱水程度会直接影响鉴别诊断与处理。"
      },
      {
        subject: "综合应用科目", topic: "病例处置流程",
        stem: "综合病例题中，形成诊疗闭环最合理的顺序是？",
        options: ["主诉采集、检查、诊断、治疗、复盘", "先用药再询问病史", "只看一项指标就下结论", "不记录治疗结果"],
        answer: 0,
        explain: "病例综合能力强调信息采集、检查验证、诊断决策、治疗执行和结果复盘的完整链条。"
      }
    ];

    const tabs = [
      ["checklist", "知识点清单"],
      ["practice", "专题练习"],
      ["wrongbook", "错题复现"],
      ["exam", "真题模拟"]
    ];

    const storeKey = "vetExamPagesState.v4";
    let state = JSON.parse(localStorage.getItem(storeKey) || "{}");
    state.tab ||= "checklist";
    state.subject ||= subjects[0].name;
    state.checked ||= {};
    state.answers ||= {};
    state.wrong ||= {};
    state.exam ||= { index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
    let reviewTimer = null;

    function save() {
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
    }

    function currentSubject() {
      return subjects.find(s => s.name === state.subject) || subjects[0];
    }

    function subjectQuestions(name = state.subject) {
      return questions.filter(q => q.subject === name);
    }

    function doneCount() {
      return Object.values(state.checked).filter(Boolean).length;
    }

    function totalTopics() {
      return subjects.reduce((sum, s) => sum + s.topics.length, 0);
    }

    function wrongList() {
      return Object.entries(state.wrong)
        .map(([id, item]) => ({ id: Number(id), ...item, q: questions[Number(id)] }))
        .filter(item => item.q)
        .sort((a, b) => b.count - a.count);
    }

    function setTab(tab) {
      state.tab = tab;
      save();
    }

    function setSubject(name) {
      state.subject = name;
      save();
    }

    function answerQuestion(index, choice) {
      state.answers[index] = choice;
      if (choice !== questions[index].answer) {
        const old = state.wrong[index] || { count: 0, last: 0 };
        state.wrong[index] = { count: old.count + 1, last: Date.now() };
      }
      save();
    }

    function answerExam(index, choice) {
      if (state.exam.submitted) return;
      state.exam.answers[index] = choice;
      if (index < questions.length - 1) {
        state.exam.index = index + 1;
      } else {
        gradeExam();
      }
      save();
    }

    function gradeExam() {
      state.exam.submitted = true;
      state.exam.reviewing = false;
      state.exam.autoReview = true;
      questions.forEach((q, index) => {
        if (state.exam.answers[index] !== q.answer) {
          const old = state.wrong[index] || { count: 0, last: 0 };
          state.wrong[index] = { count: old.count + 1, last: Date.now() };
        }
      });
    }

    function submitExam() {
      gradeExam();
      save();
    }

    function resetExam() {
      clearTimeout(reviewTimer);
      state.exam = { index: 0, answers: {}, submitted: false, reviewing: false, reviewIndex: 0, autoReview: true, startedAt: Date.now(), duration: 45 * 60 };
      save();
    }

    function startReview() {
      state.exam.reviewing = true;
      state.exam.reviewIndex = 0;
      state.exam.autoReview = true;
      save();
    }

    function skipReview() {
      state.exam.reviewing = false;
      state.exam.autoReview = false;
      save();
    }

    function moveReview(step) {
      const next = Math.max(0, Math.min(questions.length - 1, state.exam.reviewIndex + step));
      state.exam.reviewIndex = next;
      if (next >= questions.length - 1) state.exam.autoReview = false;
      save();
    }

    function renderChrome() {
      document.getElementById("stats").innerHTML = `
        <span class="pill">清单 ${doneCount()}/${totalTopics()}</span>
        <span class="pill">错题 ${wrongList().length} 题</span>
        <span class="pill">手机可用</span>
      `;

      document.getElementById("tabs").innerHTML = tabs.map(([id, label]) => `
        <button class="tab ${state.tab === id ? "active" : ""}" onclick="setTab('${id}')">${label}</button>
      `).join("");

      document.getElementById("subjects").innerHTML = subjects.map(subject => {
        const total = subject.topics.length;
        const checked = subject.topics.filter(t => state.checked[subject.name + ":" + t[0]]).length;
        return `
          <button class="subject ${state.subject === subject.name ? "active" : ""}" onclick="setSubject('${subject.name}')">
            <b>${subject.name}</b>
            <span>${subject.desc}</span>
            <div class="progress-line" style="--p:${Math.round(checked / total * 100)}%"><i></i></div>
            <span>${checked}/${total} 已掌握</span>
          </button>
        `;
      }).join("");
    }

    function renderChecklist() {
      const subject = currentSubject();
      return `
        <div class="section-head">
          <div>
            <h2>${subject.name}知识点清单</h2>
            <p class="hint">先把每个知识点按“能讲出来、能做题、能举例”三步过一遍，再进入专题练习。</p>
          </div>
          <div class="actions"><button class="btn primary" onclick="setTab('practice')">开始专题练习</button></div>
        </div>
        <div class="card">
          ${subject.topics.map(([title, desc]) => {
            const key = subject.name + ":" + title;
            return `
              <label class="check-row">
                <input type="checkbox" ${state.checked[key] ? "checked" : ""} onchange="state.checked['${key}']=this.checked;save()">
                <span><b>${title}</b><br><small>${desc}</small></span>
                <span class="badge ${state.checked[key] ? "good" : ""}">${state.checked[key] ? "已掌握" : "待学习"}</span>
              </label>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderPractice() {
      const list = subjectQuestions();
      return `
        <div class="section-head">
          <div>
            <h2>${state.subject}专题练习</h2>
            <p class="hint">每题作答后立即看解析，错题会自动进入错题本，后面按高频程度复现。</p>
          </div>
          <div class="actions"><button class="btn" onclick="setTab('wrongbook')">查看错题</button></div>
        </div>
        <div class="grid">
          ${list.map(q => {
            const index = questions.indexOf(q);
            const picked = state.answers[index];
            return questionHtml(q, index, picked, picked !== undefined, "answerQuestion");
          }).join("") || `<div class="card">该科目暂未放入练习题，替换正式题库后会自动显示。</div>`}
        </div>
      `;
    }

    function questionHtml(q, index, picked, showAnswer, handler) {
      return `
        <article class="question">
          <div class="meta">${q.subject} · ${q.topic}</div>
          <div class="stem">${index + 1}. ${q.stem}</div>
          <div class="grid">
            ${q.options.map((op, i) => {
              const cls = picked === i ? "selected" : "";
              const reveal = showAnswer ? (i === q.answer ? " correct" : picked === i && picked !== q.answer ? " wrong" : "") : "";
              const click = showAnswer ? "" : `onclick="${handler}(${index},${i})"`;
              return `<button class="option ${cls}${reveal}" ${click}><b>${"ABCD"[i]}</b><span>${op}</span></button>`;
            }).join("")}
          </div>
          ${showAnswer ? `<div class="answer-box">参考答案：${"ABCD"[q.answer]}。${q.explain}</div>` : ""}
        </article>
      `;
    }

    function renderWrongBook() {
      const list = wrongList();
      return `
        <div class="section-head">
          <div>
            <h2>错题复现</h2>
            <p class="hint">错题按出现次数排序，高频题优先复习；建议当天、3天、7天各复现一次。</p>
          </div>
          <div class="actions"><button class="btn warn" onclick="state.wrong={};save()">清空错题本</button></div>
        </div>
        <div class="grid">
          ${list.map(item => `
            <div class="card">
              <div class="section-head">
                <div>
                  <h3>${item.q.subject} · ${item.q.topic}</h3>
                  <p class="hint">${item.q.stem}</p>
                </div>
                <span class="badge ${item.count >= 2 ? "hot" : ""}">${item.count >= 2 ? "高频错题" : "错题"} ${item.count} 次</span>
              </div>
              <div class="answer-box">答案：${"ABCD"[item.q.answer]}。${item.q.explain}</div>
            </div>
          `).join("") || `<div class="card">目前还没有错题。先做专题练习或真题模拟，错题会自动汇总到这里。</div>`}
        </div>
      `;
    }

    function renderExam() {
      const exam = state.exam;
      const q = questions[exam.reviewing ? exam.reviewIndex : exam.index];
      const answered = Object.keys(exam.answers).length;
      const score = questions.filter((item, index) => exam.answers[index] === item.answer).length;
      const percent = Math.round(score / questions.length * 100);
      const unanswered = questions.length - answered;
      const wrong = questions.length - score - unanswered;

      clearTimeout(reviewTimer);
      if (exam.submitted && exam.reviewing && exam.autoReview && exam.reviewIndex < questions.length - 1) {
        reviewTimer = setTimeout(() => {
          state.exam.reviewIndex += 1;
          if (state.exam.reviewIndex >= questions.length - 1) state.exam.autoReview = false;
          save();
        }, 7000);
      }

      if (exam.submitted && !exam.reviewing) {
        return `
          <div class="section-head">
            <div>
              <h2>真题模拟测试</h2>
              <p class="hint">本次模拟已自动交卷，下面是本次成绩。</p>
            </div>
            <div class="actions"><button class="btn" onclick="resetExam()">重新开始</button></div>
          </div>
          <div class="result-panel card">
            <div>
              <div class="score">${percent}分</div>
              <p class="hint">总分 100 分，共 ${questions.length} 题；答对 ${score} 题，错题 ${wrong} 题，未答 ${unanswered} 题。</p>
            </div>
            <h3>需要现在按顺序看解析吗？</h3>
            <div class="actions">
              <button class="btn primary" onclick="startReview()">需要，看解析</button>
              <button class="btn" onclick="skipReview()">暂时不看</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="section-head">
          <div>
            <h2>真题模拟测试</h2>
            <p class="hint">${exam.reviewing ? "解析会按题号自动往后播放，也可以手动上一题或下一题。" : "选完答案自动进入下一题；最后一题答完会自动交卷计分。"}</p>
          </div>
          <div class="actions">
            <button class="btn" onclick="resetExam()">重新开始</button>
            ${exam.reviewing ? `
              <button class="btn" onclick="state.exam.autoReview=!state.exam.autoReview;save()">${exam.autoReview ? "暂停自动播放" : "继续自动播放"}</button>
            ` : `<button class="btn primary" onclick="submitExam()">提前交卷</button>`}
          </div>
        </div>
        <div class="exam-grid">
          <div>
            ${questionHtml(q, exam.reviewing ? exam.reviewIndex : exam.index, exam.answers[exam.reviewing ? exam.reviewIndex : exam.index], exam.submitted, "answerExam")}
            ${exam.reviewing ? `
              <div class="actions" style="margin-top:12px;justify-content:space-between">
                <button class="btn" onclick="moveReview(-1)" ${exam.reviewIndex === 0 ? "disabled" : ""}>上一题解析</button>
                <button class="btn primary" onclick="moveReview(1)" ${exam.reviewIndex === questions.length - 1 ? "disabled" : ""}>下一题解析</button>
              </div>
            ` : ""}
          </div>
          <div class="grid">
            <div class="card">
              <h3>${exam.reviewing ? "解析进度" : "答题进度"}</h3>
              <div class="score">${exam.reviewing ? (exam.reviewIndex + 1) + "/" + questions.length : answered + "/" + questions.length}</div>
              ${exam.submitted ? `
                <div class="score-note">
                  <span>答对 ${score}</span>
                  <span>错题 ${wrong}</span>
                  <span>未答 ${unanswered}</span>
                </div>
              ` : ""}
              <p class="hint">${exam.reviewing ? "当前解析会自动向后播放，最后一题会停住。" : "选完一题会自动跳到下一题。"}</p>
            </div>
            <div class="card">
              <h3>答题卡</h3>
              <div class="sheet">
                ${questions.map((_, i) => `<button class="${exam.answers[i] !== undefined ? "done" : ""} ${exam.index === i ? "current" : ""}" onclick="state.exam.index=${i};save()">${i + 1}</button>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderChrome();
      const view = document.getElementById("view");
      view.innerHTML = {
        checklist: renderChecklist,
        practice: renderPractice,
        wrongbook: renderWrongBook,
        exam: renderExam
      }[state.tab]();
    }

    render();
  </script>
</body>
</html>
